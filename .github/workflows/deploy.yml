name: Build, Push and Deploy

on:
  push:
    branches:
      - development

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-south-2
  ECR_REPOSITORY: blog-backend
  EC2_INSTANCE_ID: i-06aecfe604bfa091f
  ECR_REGISTRY: 991467040640.dkr.ecr.ap-south-2.amazonaws.com

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::991467040640:role/GitHubActions-ECR-Role
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker image
        run: |
          docker build \
            -t ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:latest \
            .

      - name: Push Docker image
        run: |
          docker push \
            ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:latest

      - name: Deploy to EC2
        run: |
          aws ssm send-command \
            --instance-ids "${{ env.EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=[
              "aws ecr get-login-password --region ap-south-2 | docker login --username AWS --password-stdin 991467040640.dkr.ecr.ap-south-2.amazonaws.com",
              "docker pull 991467040640.dkr.ecr.ap-south-2.amazonaws.com/blog-backend:latest",
              "docker stop blog-backend || true",
              "docker rm blog-backend || true",
              "docker run --env-file /home/ubuntu/blog-backend/.env -d --name blog-backend --restart unless-stopped -p 127.0.0.1:8000:8000 991467040640.dkr.ecr.ap-south-2.amazonaws.com/blog-backend:latest"
            ]' \
            --region "${{ env.AWS_REGION }}"